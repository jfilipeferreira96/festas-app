name: festas

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: festas-postgres
    environment:
      POSTGRES_DB: festas_db
      POSTGRES_USER: festas
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - festas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  festas_postgres_data:
