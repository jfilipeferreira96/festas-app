name: festas

services:
  mysql:
    image: mysql:8.0
    container_name: festas-mysql
    environment:
      MYSQL_DATABASE: festas_dev
      MYSQL_USER: festas
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - festas_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  festas_mysql_data:
